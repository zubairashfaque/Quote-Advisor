<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pricing ReWOO chain · Profile A">
<style><![CDATA[
svg { background: #0a0d12; font-family: 'Inter', system-ui, sans-serif; }
:root {
  --bg:#0b0e14; --bg-2:#11151f; --bg-3:#171c28;
  --ink:#e8e6e0; --ink-2:#b9b6ac; --ink-3:#7b7868;
  --rule:#2a3042; --rule-2:#1c2030;
  --amber:#f5a623; --amber-2:#e89110;
  --cyan:#4dd4ac; --rose:#ff6b9d; --violet:#a07aff;
  --blue:#5fb3ff; --red:#ff7676;
  --display:'Fraunces',serif;
  --serif:'Source Serif 4',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
.svg-box-label{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#e8e6e0;font-weight:500}
.svg-box-num{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#f5a623;letter-spacing:.1em;font-weight:500}
.svg-box-sub{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#b9b6ac;letter-spacing:.04em}
.svg-tiny{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7b7868;letter-spacing:.08em}
.svg-lane-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#7b7868;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.svg-title{font-family:'Fraunces',serif;font-size:13px;fill:#e8e6e0;font-style:italic}
.svg-rail-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#b9b6ac;letter-spacing:.08em}
.svg-arrow{stroke:#7b7868;stroke-width:1.3;fill:none}
.svg-arrow.amber{stroke:#f5a623}
.svg-arrow.cyan{stroke:#4dd4ac}
.svg-arrow.violet{stroke:#a07aff}
.svg-arrow.rose{stroke:#ff6b9d}
.svg-arrow.blue{stroke:#5fb3ff}
.svg-arrow.red{stroke:#ff7676}
.svg-arrow.dashed{stroke-dasharray:4 3;opacity:.7}
.svg-box-fill-bg{fill:#171c28}
.svg-box-fill-bg-2{fill:#11151f}
.svg-pill{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#e8e6e0;letter-spacing:.04em}
.svg-pill-tiny{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#b9b6ac;letter-spacing:.04em}
.svg-result-num{font-family:'JetBrains Mono',monospace;font-size:14px;fill:#f5a623;font-weight:500}
.svg-result-label{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#b9b6ac;letter-spacing:.1em;text-transform:uppercase}
.svg-step-num{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#f5a623;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.svg-key-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#e8e6e0}
.svg-val-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#4dd4ac}
.svg-cite{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7b7868;letter-spacing:.05em}
.svg-strike{fill:#7b7868;text-decoration:line-through}
.svg-winner-glow{filter:drop-shadow(0 0 6px rgba(245,166,35,.45))}
]]></style>
  <defs>
    <marker id="we10-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/></marker>
  </defs>

  <!-- Phase 1: Planner -->
  <text x="20" y="20" class="svg-step-num" fill="#ff6b9d">▸ PHASE 1 · PRICINGPLANNER EMITS 8-TASK DAG</text>
  <rect x="20" y="30" width="860" height="34" rx="5" fill="url(#rose-fill)" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="34" y="52" class="svg-cite">#E1 base_premium · #E2 home_value_scaling · #E3-E6 peril/claims/pool multipliers · #E7 credit · #E8 cohort_benchmark</text>
  <line x1="450" y1="68" x2="450" y2="84" class="svg-arrow rose" marker-end="url(#we10-arrow)"/>

  <!-- Phase 2: Workers — horizontal chain of multiplier pills -->
  <text x="20" y="96" class="svg-step-num" fill="#ff6b9d">▸ PHASE 2 · WORKERS ×8 RUN IN PARALLEL (NO LLM CALLS) · LangGraph Send fan-out</text>

  <!-- Pill row -->
  <g>
    <!-- base_premium -->
    <rect x="20" y="110" width="118" height="62" rx="6" fill="#0a0d12" stroke="#ff6b9d" stroke-width="1"/>
    <text x="79" y="128" text-anchor="middle" class="svg-pill" fill="#ff6b9d">#E1 base</text>
    <text x="79" y="148" text-anchor="middle" class="svg-result-num" font-size="13">$1,976</text>
    <text x="79" y="164" text-anchor="middle" class="svg-pill-tiny">CA · 2026</text>

    <!-- × -->
    <text x="148" y="148" class="svg-result-num" fill="#7b7868">×</text>

    <!-- scaling -->
    <rect x="166" y="110" width="100" height="62" rx="6" fill="#0a0d12" stroke="#ff6b9d" stroke-width="1"/>
    <text x="216" y="128" text-anchor="middle" class="svg-pill" fill="#ff6b9d">#E2 scaling</text>
    <text x="216" y="148" text-anchor="middle" class="svg-result-num" font-size="13">2.17×</text>
    <text x="216" y="164" text-anchor="middle" class="svg-pill-tiny">$900K vs $250K</text>

    <text x="276" y="148" class="svg-result-num" fill="#7b7868">×</text>

    <!-- wildfire -->
    <rect x="294" y="110" width="100" height="62" rx="6" fill="#0a0d12" stroke="#ff6b9d" stroke-width="1"/>
    <text x="344" y="128" text-anchor="middle" class="svg-pill" fill="#ff6b9d">#E3 wildfire</text>
    <text x="344" y="148" text-anchor="middle" class="svg-result-num" font-size="13">1.30×</text>
    <text x="344" y="164" text-anchor="middle" class="svg-pill-tiny">Moderate</text>

    <text x="404" y="148" class="svg-result-num" fill="#7b7868">×</text>

    <!-- seismic -->
    <rect x="422" y="110" width="100" height="62" rx="6" fill="#0a0d12" stroke="#ff6b9d" stroke-width="1"/>
    <text x="472" y="128" text-anchor="middle" class="svg-pill" fill="#ff6b9d">#E4 seismic</text>
    <text x="472" y="148" text-anchor="middle" class="svg-result-num" font-size="13">1.12×</text>
    <text x="472" y="164" text-anchor="middle" class="svg-pill-tiny">High</text>

    <text x="532" y="148" class="svg-result-num" fill="#7b7868">×</text>

    <!-- claims -->
    <rect x="550" y="110" width="100" height="62" rx="6" fill="#0a0d12" stroke="#ff6b9d" stroke-width="1"/>
    <text x="600" y="128" text-anchor="middle" class="svg-pill" fill="#ff6b9d">#E5 claims</text>
    <text x="600" y="148" text-anchor="middle" class="svg-result-num" font-size="13">1.33×</text>
    <text x="600" y="164" text-anchor="middle" class="svg-pill-tiny">1 prior</text>

    <text x="660" y="148" class="svg-result-num" fill="#7b7868">×</text>

    <!-- pool -->
    <rect x="678" y="110" width="92" height="62" rx="6" fill="#0a0d12" stroke="#ff6b9d" stroke-width="1"/>
    <text x="724" y="128" text-anchor="middle" class="svg-pill" fill="#ff6b9d">#E6 pool</text>
    <text x="724" y="148" text-anchor="middle" class="svg-result-num" font-size="13">1.12×</text>
    <text x="724" y="164" text-anchor="middle" class="svg-pill-tiny">true</text>

    <text x="780" y="148" class="svg-result-num" fill="#7b7868">×</text>

    <!-- credit (highlighted) -->
    <rect x="798" y="110" width="82" height="62" rx="6" fill="url(#amber-fill)" stroke="#f5a623" stroke-width="1.6"/>
    <text x="839" y="128" text-anchor="middle" class="svg-pill" fill="#f5a623">#E7 credit</text>
    <text x="839" y="148" text-anchor="middle" class="svg-result-num" font-size="13">1.00×</text>
    <text x="839" y="164" text-anchor="middle" class="svg-pill-tiny" fill="#f5a623">PROP 103</text>
  </g>

  <!-- Evidence row -->
  <text x="20" y="194" class="svg-pill-tiny" fill="#7b7868">evidence_ids ↓</text>
  <text x="80" y="194" class="svg-cite">BENCH-CA-2026-NEWSWEEK</text>
  <text x="240" y="194" class="svg-cite">MULT-SCALING-PER100K</text>
  <text x="385" y="194" class="svg-cite">MULT-WF-MODERATE</text>
  <text x="515" y="194" class="svg-cite">MULT-SEISMIC-HIGH</text>
  <text x="640" y="194" class="svg-cite">MULT-CLAIMS-1</text>
  <text x="730" y="194" class="svg-cite">MULT-POOL-HIGH</text>
  <text x="820" y="208" class="svg-cite" text-anchor="end" fill="#f5a623">MULT-CREDIT-DROPPED-CA-PROP103</text>

  <!-- Cohort benchmark separate -->
  <rect x="20" y="226" width="860" height="38" rx="5" fill="#0a0d12" stroke="#7b7868" stroke-width="0.8"/>
  <text x="34" y="246" class="svg-pill-tiny" fill="#b9b6ac">#E8 cohort_benchmark</text>
  <text x="170" y="246" class="svg-pill">p10 = $3,200 · p50 = $5,300 · p90 = $8,800</text>
  <text x="450" y="246" class="svg-cite">COH-CA-750-MOD-2026 (synthetic)</text>
  <text x="650" y="246" class="svg-cite">— Validator outlier band</text>
  <text x="34" y="260" class="svg-cite">used by Solver for outlier check; does not enter the multiplier chain</text>
  <line x1="450" y1="270" x2="450" y2="286" class="svg-arrow rose" marker-end="url(#we10-arrow)"/>

  <!-- Phase 3: Solver math -->
  <text x="20" y="298" class="svg-step-num" fill="#ff6b9d">▸ PHASE 3 · PRICINGSOLVER COMPOSES THE CHAIN (DETERMINISTIC MATH FIRST)</text>
  <rect x="20" y="308" width="860" height="60" rx="5" fill="url(#rose-fill)" stroke="#ff6b9d" stroke-width="1"/>
  <text x="34" y="330" class="svg-pill" fill="#b9b6ac">point =</text>
  <text x="90" y="330" class="svg-val-text" fill="#e8e6e0">$1,976</text>
  <text x="140" y="330" class="svg-val-text" fill="#7b7868">×</text>
  <text x="160" y="330" class="svg-val-text">2.17</text>
  <text x="195" y="330" class="svg-val-text" fill="#7b7868">×</text>
  <text x="215" y="330" class="svg-val-text">1.30</text>
  <text x="250" y="330" class="svg-val-text" fill="#7b7868">×</text>
  <text x="270" y="330" class="svg-val-text">1.12</text>
  <text x="305" y="330" class="svg-val-text" fill="#7b7868">×</text>
  <text x="325" y="330" class="svg-val-text">1.33</text>
  <text x="360" y="330" class="svg-val-text" fill="#7b7868">×</text>
  <text x="380" y="330" class="svg-val-text">1.12</text>
  <text x="415" y="330" class="svg-val-text" fill="#7b7868">×</text>
  <text x="435" y="330" class="svg-val-text">1.00</text>
  <text x="475" y="330" class="svg-val-text" fill="#f5a623">≈</text>
  <text x="495" y="330" class="svg-result-num">$9,308</text>
  <text x="575" y="330" class="svg-cite">point estimate</text>

  <text x="34" y="352" class="svg-pill" fill="#b9b6ac">range =</text>
  <text x="90" y="352" class="svg-val-text" fill="#e8e6e0">$9,308 × 0.75</text>
  <text x="200" y="352" class="svg-val-text" fill="#7b7868">=</text>
  <text x="220" y="352" class="svg-result-num" font-size="13">$6,981 low</text>
  <text x="335" y="352" class="svg-pill" fill="#b9b6ac"> · </text>
  <text x="355" y="352" class="svg-val-text" fill="#e8e6e0">$9,308 × 1.25</text>
  <text x="465" y="352" class="svg-val-text" fill="#7b7868">=</text>
  <text x="485" y="352" class="svg-result-num" font-size="13">$11,635 high</text>

  <!-- Validator outlier check -->
  <text x="20" y="394" class="svg-step-num" fill="#f5a623">▸ VALIDATOR OUTLIER CHECK</text>
  <rect x="20" y="404" width="860" height="62" rx="5" fill="url(#amber-fill)" stroke="#f5a623" stroke-width="1.2"/>
  <text x="34" y="426" class="svg-cite">$9,308 point estimate vs cohort: <tspan fill="#f5a623">p10=$3,200, p50=$5,300, p90=$8,800</tspan></text>
  <text x="34" y="444" class="svg-pill" fill="#ff7676">$9,308 &gt; p90 ($8,800)</text>
  <text x="220" y="444" class="svg-val-text" fill="#f5a623">→ flag=outlier</text>
  <text x="350" y="444" class="svg-cite">→ Council convenes for review</text>
  <text x="34" y="458" class="svg-cite">Outlier is justified: $900K + 1 claim + pool is unusual for the Moderate-wildfire cohort · Council confirms, downgrades confidence to ≤ 0.85</text>

  <!-- Compliance highlight -->
  <text x="20" y="498" class="svg-step-num" fill="#f5a623">▸ COMPLIANCE NOTE</text>
  <rect x="20" y="508" width="860" height="22" rx="5" fill="#0a0d12" stroke="#f5a623" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="34" y="524" class="svg-cite">The 1.00× credit multiplier is the Prop 103 contract enforcement — without it, a 700 credit would have applied 0.95× = $8,843 (still above cohort).</text>
</svg>
