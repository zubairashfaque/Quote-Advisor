  <!-- Header -->
  <text x="20" y="20" class="svg-step-num" fill="#5fb3ff">▸ recommended_coverages · CA · HO-3 BASE 5 + CEA ENDORSEMENT</text>
  <rect x="20" y="30" width="780" height="234" rx="5" fill="url(#blue-fill)" stroke="#5fb3ff" stroke-width="0.8"/>
  <!-- table header -->
  <text x="34" y="50" class="svg-cite" fill="#f5a623">#</text>
  <text x="56" y="50" class="svg-cite" fill="#f5a623">COVERAGE</text>
  <text x="430" y="50" class="svg-cite" fill="#f5a623">LIMIT</text>
  <text x="630" y="50" class="svg-cite" fill="#f5a623">SOURCE / RULE</text>
  <line x1="34" y1="56" x2="785" y2="56" stroke="#2a3042" stroke-width="0.7"/>

  <!-- Coverage rows -->
  <text x="34" y="76" class="svg-pill" fill="#5fb3ff">1</text>
  <text x="56" y="76" class="svg-key-text">Coverage A — Dwelling</text>
  <text x="430" y="76" class="svg-val-text" fill="#f5a623">$920,000</text>
  <text x="630" y="76" class="svg-cite">max(floor, RCV, value)</text>

  <text x="34" y="98" class="svg-pill" fill="#5fb3ff">2</text>
  <text x="56" y="98" class="svg-key-text">Coverage B — Other Structures</text>
  <text x="430" y="98" class="svg-val-text">$92,000</text>
  <text x="630" y="98" class="svg-cite">10% of Cov A · HO-3 default</text>

  <text x="34" y="120" class="svg-pill" fill="#5fb3ff">3</text>
  <text x="56" y="120" class="svg-key-text">Coverage C — Personal Property</text>
  <text x="430" y="120" class="svg-val-text">$460,000</text>
  <text x="630" y="120" class="svg-cite">50% of Cov A · HO-3 default</text>

  <text x="34" y="142" class="svg-pill" fill="#5fb3ff">4</text>
  <text x="56" y="142" class="svg-key-text">Coverage D — Loss of Use</text>
  <text x="430" y="142" class="svg-val-text">24 months</text>
  <text x="630" y="142" class="svg-cite" fill="#ff7676">CA §2051.5 minimum</text>

  <text x="34" y="164" class="svg-pill" fill="#5fb3ff">5</text>
  <text x="56" y="164" class="svg-key-text">Coverage E — Personal Liability</text>
  <text x="430" y="164" class="svg-val-text">$300,000</text>
  <text x="630" y="164" class="svg-cite">uplift from $100K · pool</text>

  <text x="34" y="186" class="svg-pill" fill="#5fb3ff">6</text>
  <text x="56" y="186" class="svg-key-text">Endorsement — CEA Earthquake Companion</text>
  <text x="430" y="186" class="svg-val-text">15% deductible</text>
  <text x="630" y="186" class="svg-cite" fill="#ff7676">CA §10081 · CA-EQ-OFFER</text>

  <!-- Summary line -->
  <line x1="34" y1="206" x2="785" y2="206" stroke="#2a3042" stroke-width="0.7" stroke-dasharray="3 2"/>
  <text x="34" y="225" class="svg-cite">Statutory drivers: §2051.5 (24-mo LoU), §10081 (mandatory CEA offer)</text>
  <text x="34" y="242" class="svg-cite">Tools called: replacement_cost · lender_floor · coverage_rules · cea_earthquake_recommender</text>
