<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coverage list · CA Profile A">
<style><![CDATA[
svg { background: #0a0d12; font-family: 'Inter', system-ui, sans-serif; }
:root {
  --bg:#0b0e14; --bg-2:#11151f; --bg-3:#171c28;
