<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="citizens_benchmark lookup · Miami-Dade">
<style><![CDATA[
svg { background: #0a0d12; font-family: 'Inter', system-ui, sans-serif; }
:root {
  --bg:#0b0e14; --bg-2:#11151f; --bg-3:#171c28;
  --ink:#e8e6e0; --ink-2:#b9b6ac; --ink-3:#7b7868;
  --rule:#2a3042; --rule-2:#1c2030;
  --amber:#f5a623; --amber-2:#e89110;
  --cyan:#4dd4ac; --rose:#ff6b9d; --violet:#a07aff;
  --blue:#5fb3ff; --red:#ff7676;
  --display:'Fraunces',serif;
  --serif:'Source Serif 4',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
.svg-box-label{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#e8e6e0;font-weight:500}
.svg-box-num{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#f5a623;letter-spacing:.1em;font-weight:500}
.svg-box-sub{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#b9b6ac;letter-spacing:.04em}
.svg-tiny{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7b7868;letter-spacing:.08em}
.svg-lane-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#7b7868;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.svg-title{font-family:'Fraunces',serif;font-size:13px;fill:#e8e6e0;font-style:italic}
.svg-rail-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#b9b6ac;letter-spacing:.08em}
.svg-arrow{stroke:#7b7868;stroke-width:1.3;fill:none}
.svg-arrow.amber{stroke:#f5a623}
.svg-arrow.cyan{stroke:#4dd4ac}
.svg-arrow.violet{stroke:#a07aff}
.svg-arrow.rose{stroke:#ff6b9d}
.svg-arrow.blue{stroke:#5fb3ff}
.svg-arrow.red{stroke:#ff7676}
.svg-arrow.dashed{stroke-dasharray:4 3;opacity:.7}
.svg-box-fill-bg{fill:#171c28}
.svg-box-fill-bg-2{fill:#11151f}
.svg-pill{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#e8e6e0;letter-spacing:.04em}
.svg-pill-tiny{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#b9b6ac;letter-spacing:.04em}
.svg-result-num{font-family:'JetBrains Mono',monospace;font-size:14px;fill:#f5a623;font-weight:500}
.svg-result-label{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#b9b6ac;letter-spacing:.1em;text-transform:uppercase}
.svg-step-num{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#f5a623;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.svg-key-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#e8e6e0}
.svg-val-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#4dd4ac}
.svg-cite{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7b7868;letter-spacing:.05em}
.svg-strike{fill:#7b7868;text-decoration:line-through}
.svg-winner-glow{filter:drop-shadow(0 0 6px rgba(245,166,35,.45))}
]]></style>
  <defs>
    <marker id="we13-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/></marker>
  </defs>

  <!-- Step 1: query -->
  <text x="20" y="20" class="svg-step-num" fill="#f5a623">▸ STEP 1 · QUERY</text>
  <rect x="20" y="30" width="780" height="38" rx="5" fill="url(#amber-fill)" stroke="#f5a623" stroke-width="0.8"/>
  <text x="34" y="50" class="svg-val-text">citizens_benchmark(state="FL", county_fips="12086", coastal_distance_band="coastal_0_5mi")</text>
  <text x="34" y="63" class="svg-cite">reads data/tables/citizens_2026_rate_filing.csv</text>
  <line x1="410" y1="72" x2="410" y2="86" class="svg-arrow amber" marker-end="url(#we13-arrow)"/>

  <!-- Step 2: CSV row match -->
  <text x="20" y="98" class="svg-step-num">▸ STEP 2 · ROW MATCH (filter on 3 keys)</text>
  <rect x="20" y="108" width="780" height="80" rx="5" fill="#0a0d12" stroke="#7b7868" stroke-width="0.8"/>
  <text x="34" y="126" class="svg-cite" fill="#f5a623">COUNTY_FIPS</text>
  <text x="160" y="126" class="svg-cite" fill="#f5a623">COASTAL_DIST</text>
  <text x="320" y="126" class="svg-cite" fill="#f5a623">HURRICANE_TIER</text>
  <text x="490" y="126" class="svg-cite" fill="#f5a623">$/$1000 COV A</text>
  <text x="660" y="126" class="svg-cite" fill="#f5a623">EVIDENCE_ID</text>
  <line x1="34" y1="132" x2="785" y2="132" stroke="#2a3042" stroke-width="0.7"/>
  <text x="34" y="150" class="svg-pill">12086</text><text x="160" y="150" class="svg-pill">5_to_15mi</text><text x="320" y="150" class="svg-pill">High</text><text x="490" y="150" class="svg-pill">$12.45</text><text x="660" y="150" class="svg-cite">CIT-T202-12086-2026</text>
  <!-- highlighted match -->
  <rect x="28" y="156" width="765" height="22" rx="3" fill="url(#amber-fill)" stroke="#f5a623" stroke-width="1"/>
  <text x="34" y="172" class="svg-pill" fill="#f5a623">12086</text><text x="160" y="172" class="svg-pill" fill="#f5a623">coastal_0_5mi</text><text x="320" y="172" class="svg-pill" fill="#f5a623">Very High</text><text x="490" y="172" class="svg-result-num" font-size="11">$18.20</text><text x="660" y="172" class="svg-cite" fill="#f5a623">CIT-T201-12086-2026</text>
  <line x1="410" y1="194" x2="410" y2="208" class="svg-arrow amber" marker-end="url(#we13-arrow)"/>

  <!-- Step 3: math -->
  <text x="20" y="220" class="svg-step-num" fill="#f5a623">▸ STEP 3 · SOLVER MATH</text>
  <rect x="20" y="230" width="780" height="60" rx="5" fill="url(#amber-fill)" stroke="#f5a623" stroke-width="1"/>
  <text x="34" y="252" class="svg-pill" fill="#b9b6ac">Citizens annual =</text>
  <text x="170" y="252" class="svg-val-text" fill="#e8e6e0">$18.20</text>
  <text x="225" y="252" class="svg-val-text" fill="#7b7868">×</text>
  <text x="245" y="252" class="svg-val-text">($480,000 / $1,000)</text>
  <text x="400" y="252" class="svg-val-text" fill="#7b7868">=</text>
  <text x="420" y="252" class="svg-result-num">$8,736</text>
  <text x="510" y="252" class="svg-cite">implied Citizens annual cost for this property</text>
  <text x="34" y="274" class="svg-cite">→ this is the rate ceiling per FL §627.351 glide path · admitted carriers cannot exceed this for the same risk</text>
  <line x1="410" y1="294" x2="410" y2="308" class="svg-arrow amber" marker-end="url(#we13-arrow)"/>

  <!-- Step 4: comparison -->
  <text x="20" y="320" class="svg-step-num">▸ STEP 4 · COMPARISON TO ADMITTED QUOTE</text>
  <rect x="20" y="330" width="780" height="38" rx="5" fill="#0a0d12" stroke="#f5a623" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="34" y="350" class="svg-pill">Admitted quote</text>
  <text x="150" y="350" class="svg-val-text" fill="#e8e6e0">$3,742</text>
  <text x="220" y="350" class="svg-pill" fill="#b9b6ac">vs Citizens</text>
  <text x="320" y="350" class="svg-val-text" fill="#e8e6e0">$8,736</text>
  <text x="395" y="350" class="svg-val-text" fill="#7b7868">→</text>
  <text x="420" y="350" class="svg-result-num" font-size="13">57% below Citizens</text>
  <text x="610" y="350" class="svg-cite" fill="#f5a623">meaningful saving · audit OK</text>
  <text x="34" y="364" class="svg-cite">had the admitted quote come out ABOVE Citizens, Validator would flag mispriced FL outlier</text>
</svg>
