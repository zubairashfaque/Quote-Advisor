<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cohort_benchmark lookup · Profile A">
<style><![CDATA[
svg { background: #0a0d12; font-family: 'Inter', system-ui, sans-serif; }
:root {
  --bg:#0b0e14; --bg-2:#11151f; --bg-3:#171c28;
  --ink:#e8e6e0; --ink-2:#b9b6ac; --ink-3:#7b7868;
  --rule:#2a3042; --rule-2:#1c2030;
  --amber:#f5a623; --amber-2:#e89110;
  --cyan:#4dd4ac; --rose:#ff6b9d; --violet:#a07aff;
  --blue:#5fb3ff; --red:#ff7676;
  --display:'Fraunces',serif;
  --serif:'Source Serif 4',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
.svg-box-label{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#e8e6e0;font-weight:500}
.svg-box-num{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#f5a623;letter-spacing:.1em;font-weight:500}
.svg-box-sub{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#b9b6ac;letter-spacing:.04em}
.svg-tiny{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7b7868;letter-spacing:.08em}
.svg-lane-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#7b7868;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.svg-title{font-family:'Fraunces',serif;font-size:13px;fill:#e8e6e0;font-style:italic}
.svg-rail-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#b9b6ac;letter-spacing:.08em}
.svg-arrow{stroke:#7b7868;stroke-width:1.3;fill:none}
.svg-arrow.amber{stroke:#f5a623}
.svg-arrow.cyan{stroke:#4dd4ac}
.svg-arrow.violet{stroke:#a07aff}
.svg-arrow.rose{stroke:#ff6b9d}
.svg-arrow.blue{stroke:#5fb3ff}
.svg-arrow.red{stroke:#ff7676}
.svg-arrow.dashed{stroke-dasharray:4 3;opacity:.7}
.svg-box-fill-bg{fill:#171c28}
.svg-box-fill-bg-2{fill:#11151f}
.svg-pill{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#e8e6e0;letter-spacing:.04em}
.svg-pill-tiny{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#b9b6ac;letter-spacing:.04em}
.svg-result-num{font-family:'JetBrains Mono',monospace;font-size:14px;fill:#f5a623;font-weight:500}
.svg-result-label{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#b9b6ac;letter-spacing:.1em;text-transform:uppercase}
.svg-step-num{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#f5a623;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.svg-key-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#e8e6e0}
.svg-val-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#4dd4ac}
.svg-cite{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7b7868;letter-spacing:.05em}
.svg-strike{fill:#7b7868;text-decoration:line-through}
.svg-winner-glow{filter:drop-shadow(0 0 6px rgba(245,166,35,.45))}
]]></style>
  <defs>
    <marker id="we14-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff7676"/></marker>
  </defs>

  <!-- Step 1: bucket -->
  <text x="20" y="20" class="svg-step-num" fill="#ff7676">▸ STEP 1 · BUCKET HOME_VALUE</text>
  <rect x="20" y="30" width="780" height="40" rx="5" fill="url(#red-fill)" stroke="#ff7676" stroke-width="0.8"/>
  <text x="34" y="50" class="svg-key-text">_value_band(900000)</text>
  <text x="200" y="50" class="svg-val-text" fill="#7b7868">→</text>
  <text x="220" y="50" class="svg-val-text" fill="#f5a623">"750-1000K"</text>
  <text x="345" y="50" class="svg-cite">(because 750K ≤ 900K &lt; 1M)</text>
  <text x="34" y="64" class="svg-cite">deterministic Python · pure arithmetic</text>
  <line x1="410" y1="72" x2="410" y2="88" class="svg-arrow red" marker-end="url(#we14-arrow)"/>

  <!-- Step 2: filter and match -->
  <text x="20" y="100" class="svg-step-num">▸ STEP 2 · FILTER CSV · 3 KEYS</text>
  <rect x="20" y="110" width="780" height="68" rx="5" fill="#0a0d12" stroke="#ff7676" stroke-width="0.8"/>
  <text x="34" y="132" class="svg-cite">filter where:</text>
  <text x="120" y="132" class="svg-val-text">state == "CA"</text>
  <text x="240" y="132" class="svg-cite">AND</text>
  <text x="275" y="132" class="svg-val-text">value_band == "750-1000K"</text>
  <text x="455" y="132" class="svg-cite">AND</text>
  <text x="490" y="132" class="svg-val-text">wildfire_tier == "Moderate"</text>
  <text x="34" y="150" class="svg-cite">→ exact match · single row</text>
  <text x="200" y="150" class="svg-val-text" fill="#f5a623">COH-CA-750-MOD-2026</text>
  <text x="370" y="150" class="svg-cite">(soft fallback drops tier filter if no match)</text>
  <text x="34" y="166" class="svg-pill-tiny" fill="#ff7676">⚠ row is purely synthetic — see provenance doc line 91</text>
  <line x1="410" y1="182" x2="410" y2="198" class="svg-arrow red" marker-end="url(#we14-arrow)"/>

  <!-- Step 3: returned bands -->
  <text x="20" y="210" class="svg-step-num" fill="#f5a623">▸ STEP 3 · COHORT BAND RETURNED</text>
  <rect x="20" y="220" width="780" height="90" rx="5" fill="url(#amber-fill)" stroke="#f5a623" stroke-width="1.2"/>
  <!-- band as visual gauge -->
  <text x="34" y="240" class="svg-pill" fill="#b9b6ac">COHORT (CA · 750-1000K · wildfire Moderate · n=720)</text>
  <line x1="34" y1="262" x2="780" y2="262" stroke="#7b7868" stroke-width="1"/>
  <!-- p10 marker -->
  <circle cx="120" cy="262" r="6" fill="#4dd4ac" stroke="#0a0d12" stroke-width="2"/>
  <text x="120" y="282" text-anchor="middle" class="svg-result-num" font-size="11" fill="#4dd4ac">$3,200</text>
  <text x="120" y="296" text-anchor="middle" class="svg-pill-tiny">p10</text>
  <!-- p50 marker -->
  <circle cx="360" cy="262" r="7" fill="#5fb3ff" stroke="#0a0d12" stroke-width="2"/>
  <text x="360" y="282" text-anchor="middle" class="svg-result-num" font-size="11" fill="#5fb3ff">$5,300</text>
  <text x="360" y="296" text-anchor="middle" class="svg-pill-tiny">p50 (median)</text>
  <!-- p90 marker -->
  <circle cx="620" cy="262" r="6" fill="#f5a623" stroke="#0a0d12" stroke-width="2"/>
  <text x="620" y="282" text-anchor="middle" class="svg-result-num" font-size="11" fill="#f5a623">$8,800</text>
  <text x="620" y="296" text-anchor="middle" class="svg-pill-tiny">p90</text>
  <!-- our quote marker (outside band) -->
  <line x1="720" y1="252" x2="720" y2="272" stroke="#ff7676" stroke-width="2"/>
  <line x1="715" y1="252" x2="725" y2="252" stroke="#ff7676" stroke-width="2"/>
  <line x1="715" y1="272" x2="725" y2="272" stroke="#ff7676" stroke-width="2"/>
  <text x="720" y="282" text-anchor="middle" class="svg-result-num" font-size="11" fill="#ff7676">$9,308</text>
  <text x="720" y="296" text-anchor="middle" class="svg-pill-tiny" fill="#ff7676">our quote</text>
  <line x1="410" y1="320" x2="410" y2="336" class="svg-arrow red" marker-end="url(#we14-arrow)"/>

  <!-- Step 4: validator outlier escalation -->
  <text x="20" y="348" class="svg-step-num" fill="#ff7676">▸ STEP 4 · VALIDATOR OUTLIER CHECK</text>
  <rect x="20" y="358" width="780" height="74" rx="5" fill="url(#red-fill)" stroke="#ff7676" stroke-width="1"/>
  <text x="34" y="378" class="svg-pill">$9,308 &gt; p90 ($8,800)</text>
  <text x="220" y="378" class="svg-val-text" fill="#f5a623">→ flag = outlier</text>
  <text x="370" y="378" class="svg-cite">→ Council Actuary persona convenes</text>
  <text x="34" y="396" class="svg-cite">Council reviews Profile A's unusual combo (seismic HIGH + pool + 1 claim) and confirms $9,308 is defensible.</text>
  <text x="34" y="414" class="svg-cite" fill="#f5a623">Outcome: quote ships · confidence_score capped at 0.85 to reflect the outlier flag · audit chain remains intact.</text>
</svg>
