<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 820 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Credit suppression pipeline · CA Profile A">
<style><![CDATA[
svg { background: #0a0d12; font-family: 'Inter', system-ui, sans-serif; }
:root {
  --bg:#0b0e14; --bg-2:#11151f; --bg-3:#171c28;
  --ink:#e8e6e0; --ink-2:#b9b6ac; --ink-3:#7b7868;
  --rule:#2a3042; --rule-2:#1c2030;
  --amber:#f5a623; --amber-2:#e89110;
  --cyan:#4dd4ac; --rose:#ff6b9d; --violet:#a07aff;
  --blue:#5fb3ff; --red:#ff7676;
  --display:'Fraunces',serif;
  --serif:'Source Serif 4',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
.svg-box-label{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#e8e6e0;font-weight:500}
.svg-box-num{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#f5a623;letter-spacing:.1em;font-weight:500}
.svg-box-sub{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#b9b6ac;letter-spacing:.04em}
.svg-tiny{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7b7868;letter-spacing:.08em}
.svg-lane-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#7b7868;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.svg-title{font-family:'Fraunces',serif;font-size:13px;fill:#e8e6e0;font-style:italic}
.svg-rail-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#b9b6ac;letter-spacing:.08em}
.svg-arrow{stroke:#7b7868;stroke-width:1.3;fill:none}
.svg-arrow.amber{stroke:#f5a623}
.svg-arrow.cyan{stroke:#4dd4ac}
.svg-arrow.violet{stroke:#a07aff}
.svg-arrow.rose{stroke:#ff6b9d}
.svg-arrow.blue{stroke:#5fb3ff}
.svg-arrow.red{stroke:#ff7676}
.svg-arrow.dashed{stroke-dasharray:4 3;opacity:.7}
.svg-box-fill-bg{fill:#171c28}
.svg-box-fill-bg-2{fill:#11151f}
.svg-pill{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#e8e6e0;letter-spacing:.04em}
.svg-pill-tiny{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#b9b6ac;letter-spacing:.04em}
.svg-result-num{font-family:'JetBrains Mono',monospace;font-size:14px;fill:#f5a623;font-weight:500}
.svg-result-label{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#b9b6ac;letter-spacing:.1em;text-transform:uppercase}
.svg-step-num{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#f5a623;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.svg-key-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#e8e6e0}
.svg-val-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#4dd4ac}
.svg-cite{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7b7868;letter-spacing:.05em}
.svg-strike{fill:#7b7868;text-decoration:line-through}
.svg-winner-glow{filter:drop-shadow(0 0 6px rgba(245,166,35,.45))}
]]></style>
  <defs>
    <marker id="we1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b7868"/></marker>
  </defs>
  <!-- Step 1: customer input -->
  <text x="20" y="20" class="svg-step-num">▸ STEP 1 · CUSTOMER INPUT</text>
  <rect x="20" y="30" width="780" height="50" rx="5" fill="#11151f" stroke="#7b7868" stroke-width="0.8"/>
  <text x="34" y="50" class="svg-key-text">state =</text><text x="92" y="50" class="svg-val-text">"CA"</text>
  <text x="160" y="50" class="svg-key-text">credit_score =</text><text x="280" y="50" class="svg-val-text">700</text>
  <text x="335" y="50" class="svg-key-text">dwelling_value =</text><text x="470" y="50" class="svg-val-text">900000</text>
  <text x="34" y="68" class="svg-cite">customer sends raw profile to CLI · &lt;invocation&gt; → IntentClassifier → StatutoryAgent</text>
  <line x1="410" y1="84" x2="410" y2="106" class="svg-arrow" marker-end="url(#we1-arrow)"/>

  <!-- Step 2: StatutoryAgent retrieves chunk -->
  <text x="20" y="118" class="svg-step-num" fill="#ff7676">▸ STEP 2 · STATUTORYAGENT (ReAct + RAG)</text>
  <rect x="20" y="128" width="780" height="56" rx="5" fill="url(#red-fill)" stroke="#ff7676" stroke-width="1"/>
  <text x="34" y="150" class="svg-key-text">rag_retrieve(query="Prop 103 credit", corpus="ca_doi", jurisdiction="CA")</text>
  <text x="34" y="168" class="svg-cite">returns chunk evidence_id =</text>
  <text x="178" y="168" class="svg-val-text" font-size="10">CDI-PROP103-01</text>
  <text x="290" y="168" class="svg-cite">from data/corpora/ca_doi/01_prop103_overview.md</text>
  <line x1="410" y1="188" x2="410" y2="210" class="svg-arrow red" marker-end="url(#we1-arrow)"/>

  <!-- Step 3: Action emitted -->
  <text x="20" y="222" class="svg-step-num" fill="#ff7676">▸ STEP 3 · RULE FIRES</text>
  <rect x="20" y="232" width="780" height="62" rx="5" fill="#11151f" stroke="#ff7676" stroke-width="0.8"/>
  <text x="34" y="254" class="svg-key-text">rule_id =</text><text x="106" y="254" class="svg-val-text">CA-PROP103-CREDIT</text>
  <text x="280" y="254" class="svg-cite">citation: Cal. Code Regs. tit. 10 §2632.5</text>
  <text x="34" y="272" class="svg-key-text">action =</text>
  <text x="98" y="272" class="svg-val-text">{type: "drop_field", field: "credit_score"}</text>
  <text x="34" y="288" class="svg-cite">severity = mandatory · evidence_id = CDI-PROP103-01</text>
  <line x1="410" y1="298" x2="410" y2="320" class="svg-arrow red" marker-end="url(#we1-arrow)"/>

  <!-- Step 4: state mutation -->
  <text x="20" y="332" class="svg-step-num">▸ STEP 4 · STATE MUTATION (PURE PYTHON)</text>
  <rect x="20" y="342" width="780" height="58" rx="5" fill="#11151f" stroke="#7b7868" stroke-width="0.8"/>
  <text x="34" y="364" class="svg-key-text">sanitized_profile.credit_score =</text>
  <text x="282" y="364" class="svg-val-text">None</text>
  <text x="338" y="364" class="svg-cite">← raw 700 removed</text>
  <text x="34" y="382" class="svg-key-text">field_treatments["credit_score"] =</text>
  <text x="290" y="382" class="svg-val-text">"dropped_by_CA-PROP103-CREDIT"</text>
  <line x1="410" y1="404" x2="410" y2="426" class="svg-arrow" marker-end="url(#we1-arrow)"/>

  <!-- Step 5: Pricing planner emits task (LEFT half) -->
  <text x="20" y="438" class="svg-step-num" fill="#ff6b9d">▸ STEP 5 · PRICINGPLANNER EMITS TASK</text>
  <rect x="20" y="448" width="395" height="62" rx="5" fill="url(#rose-fill)" stroke="#ff6b9d" stroke-width="1"/>
  <text x="34" y="468" class="svg-key-text">pricing_multiplier_lookup(</text>
  <text x="34" y="484" class="svg-val-text">  dimension="credit_score",</text>
  <text x="34" y="500" class="svg-val-text">  key="dropped")</text>

  <!-- Step 6: Final output (RIGHT half — separate column) -->
  <text x="425" y="438" class="svg-step-num" fill="#f5a623">▸ STEP 6 · MULTIPLIER RETURNED</text>
  <rect x="425" y="448" width="375" height="62" rx="5" fill="url(#amber-fill)" stroke="#f5a623" stroke-width="1.2"/>
  <text x="439" y="468" class="svg-key-text">multiplier =</text>
  <text x="535" y="468" class="svg-result-num" font-size="13">1.00 ×</text>
  <text x="439" y="486" class="svg-pill-tiny" fill="#f5a623">MULT-CREDIT-DROPPED-CA-PROP103</text>
  <text x="439" y="502" class="svg-cite">visible in factor_chain · regulator-auditable</text>

  <!-- Connector arrow between Step 5 and Step 6 -->
  <line x1="416" y1="479" x2="424" y2="479" class="svg-arrow rose"/>

  <!-- Bottom takeaway -->
  <text x="410" y="528" text-anchor="middle" class="svg-result-label" fill="#f5a623">Credit (dropped per Prop 103)  ×1.00  ·  audit chain intact end-to-end</text>
</svg>
