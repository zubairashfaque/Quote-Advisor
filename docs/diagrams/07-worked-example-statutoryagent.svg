.svg-result-num{font-family:'JetBrains Mono',monospace;font-size:14px;fill:#f5a623;font-weight:500}
.svg-result-label{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#b9b6ac;letter-spacing:.1em;text-transform:uppercase}
.svg-step-num{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#f5a623;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.svg-key-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#e8e6e0}
.svg-val-text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#4dd4ac}
.svg-cite{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7b7868;letter-spacing:.05em}
.svg-strike{fill:#7b7868;text-decoration:line-through}
.svg-winner-glow{filter:drop-shadow(0 0 6px rgba(245,166,35,.45))}
]]></style>
  <defs>
    <marker id="we4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff7676"/></marker>
  </defs>
  <!-- Phase 1 -->
  <text x="20" y="20" class="svg-step-num" fill="#ff7676">▸ PHASE 1 · PRE-FILTER</text>
  <rect x="20" y="30" width="780" height="34" rx="5" fill="url(#red-fill)" stroke="#ff7676" stroke-width="1"/>
  <text x="34" y="52" class="svg-key-text">state =</text>
  <text x="92" y="52" class="svg-val-text">"CA"</text>
  <text x="140" y="52" class="svg-cite">→ in {CA, FL}, proceed to ReAct loop · short-circuit NOT triggered</text>
  <line x1="410" y1="68" x2="410" y2="84" class="svg-arrow red" marker-end="url(#we4-arrow)"/>

  <!-- Phase 2 — 6 ReAct iterations as table -->
  <text x="20" y="96" class="svg-step-num" fill="#ff7676">▸ PHASE 2 · REACT LOOP · 6 ITERATIONS · ALL AGAINST ca_doi (jurisdiction=CA)</text>
  <rect x="20" y="106" width="780" height="160" rx="5" fill="#11151f" stroke="#ff7676" stroke-width="0.8"/>
  <!-- Table header -->
  <text x="34" y="124" class="svg-cite" fill="#f5a623">#</text>
  <text x="60" y="124" class="svg-cite" fill="#f5a623">QUERY</text>
  <text x="290" y="124" class="svg-cite" fill="#f5a623">CHUNK · evidence_id</text>
  <text x="540" y="124" class="svg-cite" fill="#f5a623">RULE FIRED</text>
  <line x1="34" y1="130" x2="785" y2="130" stroke="#2a3042" stroke-width="0.7"/>
  <!-- Rows -->
  <text x="34" y="146" class="svg-pill">1</text><text x="60" y="146" class="svg-pill">q='standard form'</text>
  <text x="290" y="146" class="svg-pill">CDI-STDFORM-01</text><text x="540" y="146" class="svg-pill" fill="#ff7676">CA-STDFORM-2071</text>
  <text x="34" y="164" class="svg-pill">2</text><text x="60" y="164" class="svg-pill">q='age'</text>
  <text x="290" y="164" class="svg-pill">CDI-PROP103-01</text><text x="540" y="164" class="svg-pill" fill="#ff7676">CA-AGE-NON-PRIMARY</text>
  <text x="34" y="182" class="svg-pill">3</text><text x="60" y="182" class="svg-pill">q='FAIR Plan'</text>
  <text x="290" y="182" class="svg-pill">CDI-FAIR-01</text><text x="540" y="182" class="svg-pill" fill="#ff7676">CA-FAIRPLAN-CHECK</text>
  <text x="34" y="200" class="svg-pill">4</text><text x="60" y="200" class="svg-pill">q='Prop 103 credit'</text>
  <text x="290" y="200" class="svg-pill">CDI-PROP103-01</text><text x="540" y="200" class="svg-pill" fill="#ff7676">CA-PROP103-CREDIT</text>
  <text x="34" y="218" class="svg-pill">5</text><text x="60" y="218" class="svg-pill">q='earthquake offer'</text>
  <text x="290" y="218" class="svg-pill">CDI-PROP103-01</text><text x="540" y="218" class="svg-pill" fill="#ff7676">CA-EQ-OFFER</text>
  <text x="34" y="236" class="svg-pill">6</text><text x="60" y="236" class="svg-pill">q='loss-of-use'</text>
  <text x="290" y="236" class="svg-pill">CDI-COVD-01</text><text x="540" y="236" class="svg-pill" fill="#ff7676">CA-COVD-MIN-24MO</text>
  <text x="34" y="258" class="svg-cite">LLM picks queries adaptively; max 8 iterations · agent stopped at 6 (picture complete)</text>
  <line x1="410" y1="270" x2="410" y2="286" class="svg-arrow red" marker-end="url(#we4-arrow)"/>

  <!-- Phase 3 -->
  <text x="20" y="298" class="svg-step-num" fill="#ff7676">▸ PHASE 3 · STRUCTURED EMISSION (2nd LLM call · Pydantic strict mode)</text>
  <rect x="20" y="308" width="780" height="28" rx="5" fill="#11151f" stroke="#ff7676" stroke-width="0.8"/>
  <text x="34" y="326" class="svg-cite">Coerce narrative into 6 typed RuleFire records · each carries its evidence_id from Phase 2</text>
  <line x1="410" y1="340" x2="410" y2="356" class="svg-arrow red" marker-end="url(#we4-arrow)"/>

  <!-- Phase 4 -->
  <text x="20" y="368" class="svg-step-num" fill="#ff7676">▸ PHASE 4 · SELF-CHECK</text>
  <rect x="20" y="378" width="780" height="28" rx="5" fill="#11151f" stroke="#ff7676" stroke-width="0.8"/>
  <text x="34" y="396" class="svg-cite">All 6 evidence_ids match Phase-2 retrieved chunks · 0 dropped · grounding = 100%</text>
  <line x1="410" y1="410" x2="410" y2="426" class="svg-arrow red" marker-end="url(#we4-arrow)"/>

  <!-- Phase 5 (not invoked) -->
  <rect x="20" y="438" width="780" height="20" rx="5" fill="#0a0d12" stroke="#7b7868" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="34" y="452" class="svg-cite">▸ PHASE 5 · DETERMINISTIC SAFETY NET · not invoked · LLM-success path held</text>

  <!-- Output -->
  <text x="20" y="478" class="svg-step-num">▸ OUTPUT TO GRAPHSTATE (8 FIELDS)</text>
  <rect x="20" y="488" width="780" height="46" rx="5" fill="url(#amber-fill)" stroke="#f5a623" stroke-width="1.2"/>
  <text x="34" y="506" class="svg-pill">sanitized_profile.credit_score = None · triggered_rules = [6] · field_treatments = {credit_score: dropped_by_CA-PROP103-CREDIT}</text>
  <text x="34" y="522" class="svg-pill">required_offers = [CEA_earthquake] · floors = {loss_of_use_months: 24} · market_route_hints = ['fair_plan_check_if_fhsz_high']</text>
</svg>
