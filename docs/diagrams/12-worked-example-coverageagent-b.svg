  <text x="56" y="76" class="svg-key-text">Coverage A — Dwelling</text>
  <text x="430" y="76" class="svg-val-text" fill="#f5a623">$480,000</text>
  <text x="630" y="76" class="svg-cite">max(floor, RCV, value)</text>

  <text x="34" y="96" class="svg-pill" fill="#5fb3ff">2</text>
  <text x="56" y="96" class="svg-key-text">Coverage B — Other Structures</text>
  <text x="430" y="96" class="svg-val-text">$48,000</text>
  <text x="630" y="96" class="svg-cite">10% of Cov A</text>

  <text x="34" y="116" class="svg-pill" fill="#5fb3ff">3</text>
  <text x="56" y="116" class="svg-key-text">Coverage C — Personal Property</text>
  <text x="430" y="116" class="svg-val-text">$240,000</text>
  <text x="630" y="116" class="svg-cite">50% of Cov A</text>

  <text x="34" y="136" class="svg-pill" fill="#5fb3ff">4</text>
  <text x="56" y="136" class="svg-key-text">Coverage D — Loss of Use</text>
  <text x="430" y="136" class="svg-val-text">12 months</text>
  <text x="630" y="136" class="svg-cite">FL has no §2051.5 minimum</text>

  <text x="34" y="156" class="svg-pill" fill="#5fb3ff">5</text>
  <text x="56" y="156" class="svg-key-text">Coverage E — Personal Liability</text>
  <text x="430" y="156" class="svg-val-text">$300,000</text>
  <text x="630" y="156" class="svg-cite">recommended uplift</text>

  <text x="34" y="178" class="svg-pill" fill="#5fb3ff">6</text>
  <text x="56" y="178" class="svg-key-text">Endorsement — CGCC</text>
  <text x="430" y="178" class="svg-val-text">full Cov A</text>
  <text x="630" y="178" class="svg-cite" fill="#ff7676">FL §627.706 · MANDATORY</text>

  <text x="34" y="198" class="svg-pill" fill="#5fb3ff">7</text>
  <text x="56" y="198" class="svg-key-text">Hurricane Deductible · $500 flat</text>
  <text x="430" y="198" class="svg-val-text">factor 1.30×</text>
  <text x="630" y="198" class="svg-cite" fill="#ff7676">FL §627.701 OPTION</text>

  <text x="34" y="218" class="svg-pill" fill="#5fb3ff">8</text>
  <text x="56" y="218" class="svg-key-text">Hurricane Deductible · 2% of Cov A</text>
  <text x="430" y="218" class="svg-val-text">factor 1.10× ◀ typical</text>
  <text x="630" y="218" class="svg-cite" fill="#ff7676">FL §627.701 OPTION</text>

  <text x="34" y="238" class="svg-pill" fill="#5fb3ff">9</text>
  <text x="56" y="238" class="svg-key-text">Hurricane Deductible · 5% of Cov A</text>
  <text x="430" y="238" class="svg-val-text">factor 0.92×</text>
  <text x="630" y="238" class="svg-cite" fill="#ff7676">FL §627.701 OPTION</text>

  <text x="34" y="258" class="svg-pill" fill="#5fb3ff">10</text>
  <text x="56" y="258" class="svg-key-text">Hurricane Deductible · 10% of Cov A</text>
  <text x="430" y="258" class="svg-val-text">factor 0.78×</text>
  <text x="630" y="258" class="svg-cite" fill="#ff7676">FL §627.701 OPTION</text>

  <text x="34" y="278" class="svg-pill" fill="#5fb3ff">11</text>
  <text x="56" y="278" class="svg-key-text">Wind Mitigation Inspection (advisory)</text>
