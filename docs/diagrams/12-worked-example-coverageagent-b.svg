  <!-- Summary -->
  <line x1="34" y1="320" x2="785" y2="320" stroke="#2a3042" stroke-width="0.7" stroke-dasharray="3 2"/>
  <text x="34" y="338" class="svg-cite">Statutory drivers: §627.706 (CGCC), §627.701 (4 hurricane ded options), OIR-B1-1802 (wind), NFIP (in_sfha + mortgaged)</text>
  <text x="34" y="356" class="svg-cite">Tools called: replacement_cost · lender_floor · coverage_rules · fl_hurricane_deductible · wind_mitigation_discount</text>
  <text x="34" y="376" class="svg-cite">Compared to CA: 6 extra lines come from FL statute density · 4 hurricane options are mandatory offers, customer picks one</text>
  <text x="34" y="394" class="svg-cite">NFIP fires because both in_sfha=true AND has_mortgage=true · FDPA 1973 federal mandate</text>
